name: Eventide Repair Engine
on:
  workflow_dispatch:
    inputs:
      mode: { description: 'Mode (1/2)', required: true, default: '1' }
      configuration: { description: 'Config', required: true, default: 'Debug' }

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Run Workflow Adapter
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_CONFIGURATION: ${{ github.event.inputs.configuration }}
          INPUT_TARGET: '.'
        run: python workflow/run.py
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-reports
          path: reports/
